[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webassetify"
version = "1.1.0"
description = "Automated Asset Harvester, Web Optimizer (.webp/.webm), and Cloud Delivery Pipeline."
readme = "README.md"
authors = [
    { name = "Fatir Gibran", email = "fatirgibrann@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["webp", "webm", "media-optimizer", "telegram-bot", "google-drive", "asset-harvester"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
    "python-telegram-bot[job-queue]>=20.0,<22.0",
    "aiohttp>=3.9.0,<4.0.0",
    "pypdf>=4.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "Pillow>=10.0.0,<12.0.0",
    "yt-dlp>=2024.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
webassetify = "main:main"
webassetify-cli = "cli:main"

[project.urls]
Homepage = "https://github.com/FatirGibran/WebAssetify"
Repository = "https://github.com/FatirGibran/WebAssetify.git"
Issues = "https://github.com/FatirGibran/WebAssetify/issues"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::urllib3.exceptions.NotOpenSSLWarning",
    "ignore::FutureWarning:google.*",
]
